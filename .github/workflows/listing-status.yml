name: Listing status

# Daily, read-only check of directory listings. Opens (or comments on) an issue when a
# listing goes live, so the owner gets a GitHub notification.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: status
        run: node scripts/listing-status.mjs
      - name: Notify via issue when something is newly live
        if: steps.status.outputs.found != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FOUND: ${{ steps.status.outputs.found }}
          REPORT: ${{ steps.status.outputs.report }}
        run: |
          title="Listing update: ${FOUND}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$REPORT"
          else
            echo "Already reported in #$existing"
          fi
