name: Edge benchmark

# Manual only. Drives the temporary agentread-bench Worker (src/bench.ts) from GitHub's
# network to compare extraction engines on Cloudflare's edge (CPU limits apply there).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "mode=url pairs, comma-separated"
        required: true
        default: "lite=https://agentread-bench-lite.omar-cv.workers.dev,readability=https://agentread-bench-readability.omar-cv.workers.dev,raw=https://agentread-bench-raw.omar-cv.workers.dev"
      selector:
        description: "cssSelector for raw mode (optional)"
        required: false
        default: ""
      repeat:
        description: "Requests per page per engine"
        required: true
        default: "3"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/bench-edge.mjs
        env:
          BENCH_TARGETS: ${{ inputs.targets }}
          BENCH_SELECTOR: ${{ inputs.selector }}
          BENCH_PREVIEW: "2500"
          BENCH_TOKEN: ${{ secrets.BENCH_TOKEN }}
          BENCH_REPEAT: ${{ inputs.repeat }}
